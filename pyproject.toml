[project]
name = "memory-card"
version = "0.1.0"
description = "Captura de insights por voz em mobilidade, com transcrição local e classificação por modelo de linguagem"
requires-python = ">=3.10"

dependencies = [
    "python-dotenv>=1.0",      # carga do .env, T004
    "requests>=2.31",          # API do Telegram e do provedor de linguagem
    "faster-whisper>=1.0",     # transcrição local; reimplementação do Whisper, bem mais rápida em CPU
    "flask>=3.0",              # painel local e páginas de confirmação
    "anthropic>=0.116",        # adaptador concreto de classificação, T030
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
memory-card = "memory_card.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memory_card*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
